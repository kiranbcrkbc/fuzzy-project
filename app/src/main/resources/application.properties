spring.application.name=Fuzzy Integrity Auditing
spring.profiles.default=demo
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.sql.init.mode=always
spring.thymeleaf.cache=false
fuzzy.data-root=${FUZZY_DATA_ROOT:./data}
fuzzy.demo=false
fuzzy.smtp=false
fuzzy.object-store=${FUZZY_OBJECT_STORE:disk}
fuzzy.master-key-base64=${FUZZY_MASTER_KEY:}
server.error.include-message=never
