<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout::head('Operation blocked')}"></head><body><header th:replace="~{layout::header}"></header><main class="auth-single card"><p class="eyebrow">OPERATION NOT COMPLETED</p><h1>Let's resolve that.</h1><p class="error-message" th:text="${errorMessage ?: 'This request was blocked. Check your permissions or sign in again.'}"></p><div class="actions"><a class="button" href="/dashboard">Return to overview</a><a class="button secondary" href="/login">Sign in</a><a class="button secondary" th:if="${me != null and me.role == 'USER'}" href="/user/fuzzy">Identity check</a></div></main><footer th:replace="~{layout::footer}"></footer></body></html>
