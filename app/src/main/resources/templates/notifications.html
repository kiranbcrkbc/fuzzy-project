<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout::head('Recipient inbox')}"></head><body><header th:replace="~{layout::header}"></header><main class="narrow"><p class="eyebrow">RECIPIENT-SPECIFIC NOTIFICATIONS</p><h1>Your local inbox</h1><p class="callout">These persisted application notices simulate email delivery. Only your account's messages appear here. OTP messages are separately restricted to the initiating sign-in session.</p><section class="card"><article class="message" th:each="n:${messages}"><small th:text="${@ui.when(n.created_at)}"></small><p th:text="${n.message}"></p></article><p th:if="${#lists.isEmpty(messages)}" class="empty">No notifications yet.</p></section></main><footer th:replace="~{layout::footer}"></footer></body></html>
