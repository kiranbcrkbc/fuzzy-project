<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout::head('Verify OTP')}"></head><body><header th:replace="~{layout::header}"></header><main class="auth-single card"><p class="eyebrow">SIGN-IN · STEP 2</p><h1>Verify your one-use code</h1><p>Recipient: <strong th:text="${otpEmail}"></strong></p><p>Expires at <span th:text="${#dates.format(expires,'HH:mm:ss')}"></span>. Five attempts maximum. The code cannot be reused.</p><p th:if="${demo}" class="callout">Simulated email: <a href="/demo-inbox" target="_blank">Open your session's demo inbox ↗</a></p><form th:action="@{/otp}" method="post" class="stack"><label>Six-digit code<input name="code" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code" autofocus></label><button>Verify and sign in</button></form><p><a href="/login">Start a new sign-in</a></p></main><footer th:replace="~{layout::footer}"></footer></body></html>
