<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout::head('Inspect enrollment')}"></head><body><header th:replace="~{layout::header}"></header><main class="narrow"><p class="eyebrow">KGC · ENROLLMENT REVIEW</p><h1 th:text="${account.display_name}"></h1><section class="card"><dl><dt>Email</dt><dd th:text="${account.email}"></dd><dt>Status</dt><dd th:text="${account.approval}"></dd><dt>DOB</dt><dd th:text="${account.dob}"></dd><dt>Gender</dt><dd th:text="${account.gender}"></dd><dt>Phone</dt><dd th:text="${account.phone}"></dd><dt>City / country</dt><dd th:text="${account.city} + ' / ' + ${account.country}"></dd><dt>Synthetic identity template</dt><dd th:text="${account.attributes}"></dd><dt>Application key</dt><dd th:text="${accountKey}"></dd></dl><h3>Signature enrollment preview</h3><img th:if="${account.signature_data != null}" class="signature-preview" th:src="@{/kgc/users/{id}/signature(id=${account.id})}" alt="Enrolled signature"><p th:if="${account.signature_data == null}" class="muted">No signature image enrolled.</p><p class="callout">This image is a profile artifact. It is not analyzed for biometric recognition.</p><form th:if="${account.approval == 'PENDING'}" th:action="@{/kgc/users/{id}/decide(id=${account.id})}" method="post" class="actions"><button name="decision" value="APPROVED">Approve &amp; issue application key</button><button class="danger" name="decision" value="REJECTED">Reject registration</button></form></section></main><footer th:replace="~{layout::footer}"></footer></body></html>
