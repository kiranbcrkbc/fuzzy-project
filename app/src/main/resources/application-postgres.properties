spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.schema-locations=classpath:schema-postgres.sql
fuzzy.object-store=sql
fuzzy.master-key-base64=${FUZZY_MASTER_KEY}
